[workspace]
resolver = "3"
members = [
    "crates/gate",
    "crates/gate-args",
    "crates/gate-desktop",
    "crates/gate-router",
    "crates/gate-state",
    "crates/gate-watchdog",
    "crates/gate-win32",
    "crates/gate-wire",
    "crates/proc-table",
]

[workspace.package]
version = "0.1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"

# Tests build with `--profile test-release`: optimised like release, without the LTO and single
# codegen unit that make every test rebuild take minutes.
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
