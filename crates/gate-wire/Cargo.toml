[package]
name = "gate-wire"
version.workspace = true
edition = "2024"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# Says so in the version text, as `+seams`, so a build with the test seams never matches the exact version of the clean
# build it is installed beside. Forwarded by every crate whose own `test-seams` feature is the gate's.
test-seams = []

[dependencies]
base64 = "0.23.1"
gate-args = { path = "../gate-args" }
gate-router = { path = "../gate-router" }
jiff = "0.2.37"
proc-table = { path = "../proc-table" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
