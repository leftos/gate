[package]
name = "gate-state"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1.10"
jiff = "0.2.37"
proc-table = { path = "../proc-table" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
gate-args = { path = "../gate-args" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
