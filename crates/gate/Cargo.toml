[package]
name = "gate"
version.workspace = true
edition = "2024"
publish = false

[lints]
workspace = true

[features]
# The hidden `--test-*` flags and the `fake-tool` helper the black-box suite needs; an installed gate is built without.
test-seams = ["gate-args/test-seams"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
gate-args = { path = "../gate-args" }
gate-desktop = { path = "../gate-desktop" }
gate-router = { path = "../gate-router" }
gate-state = { path = "../gate-state" }
gate-watchdog = { path = "../gate-watchdog" }
gate-win32 = { path = "../gate-win32" }
jiff = "0.2.37"
proc-table = { path = "../proc-table" }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
# Reads `.gate/toolchain.toml` into a `toml::Table`, its keys in file order; no writer, no derive.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
# `Win32_Storage_FileSystem` for the outputs walk and pack; `Win32_System_Console` for `fake-tool`, a `test-seams` bin.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
zstd = "0.14.2"

[dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "gate"
path = "src/main.rs"

[[bin]]
name = "fake-tool"
path = "src/bin/fake-tool.rs"
required-features = ["test-seams"]

[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"
required-features = ["test-seams"]

# Without the `test-seams` feature (`--all-features` or `--features test-seams`) cargo skips this suite silently.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["test-seams"]
