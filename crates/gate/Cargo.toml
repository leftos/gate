[package]
name = "gate"
version.workspace = true
edition = "2024"
publish = false

[lints]
workspace = true

[features]
# The hidden `--test-*` flags, the `fake-tool` helper and the stand-in desktop helper the black-box suite needs; an
# installed gate is built without. The stand-in runs `gate-desktop`'s own code, so its seams come on too.
test-seams = ["gate-args/test-seams", "gate-win32/test-seams", "gate-desktop/test-seams", "gate-wire/test-seams"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
gate-args = { path = "../gate-args" }
gate-desktop = { path = "../gate-desktop" }
gate-inputs = { path = "../gate-inputs" }
gate-router = { path = "../gate-router" }
gate-state = { path = "../gate-state" }
gate-watchdog = { path = "../gate-watchdog" }
gate-win32 = { path = "../gate-win32" }
gate-wire = { path = "../gate-wire" }
jiff = "0.2.37"
proc-table = { path = "../proc-table" }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
# Reads `.gate/toolchain.toml` into a `toml::Table`, its keys in file order; no writer, no derive.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
# `Win32_Storage_FileSystem` for the outputs walk and pack, and with `Win32_System_IO` for the heartbeat's zero-byte
# `WriteFile` probe of stderr; `Win32_Foundation` and `Win32_Security*` for the owner of the
# MSYS keeper's folder; `Win32_System_Console`, `Win32_System_Threading` and `Win32_System_RemoteDesktop` serve only
# `fake-tool`, and `Win32_System_JobObjects` only `fake-ssh` (and `late.rs`'s tests, which the dev-dependency below also
# serves), `test-seams` bins, and so compile into `gate.exe` unused (a package's bins cannot use its dev-dependencies, so
# they cannot be moved there).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
zstd = "0.14.2"

[dev-dependencies]
# Reads the built exe's import and load config directories (`image`): parsing the load config by hand is error-prone,
# and the crate is test-only.
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "std"] }
# The MSYS keeper's machine-alone case reads Git's MSYS section (`Wdk_*`, `Win32_Security`, `Win32_System_Memory`,
# `Win32_System_RemoteDesktop`); the heartbeat's probe tests fill a pipe that does not wait (`Win32_System_Pipes`);
# stop-tree's already-ending case holds a process's exit as its debugger (`Win32_System_Diagnostics_Debug`).
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[[bin]]
name = "gate"
path = "src/main.rs"

[[bin]]
name = "fake-tool"
path = "src/bin/fake-tool.rs"
required-features = ["test-seams"]

[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"
required-features = ["test-seams"]

[[bin]]
name = "fake-desktop-helper"
path = "src/bin/fake-desktop-helper.rs"
required-features = ["test-seams"]

# Without the `test-seams` feature (`--all-features` or `--features test-seams`) cargo skips this suite silently.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["test-seams"]
