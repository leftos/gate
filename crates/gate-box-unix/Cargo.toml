[package]
name = "gate-box-unix"
version.workspace = true
edition = "2024"
publish = false

[lib]
doctest = false

[[bin]]
name = "gate-box"
path = "src/main.rs"

[[test]]
# `gate-box box run` end to end through the built binary, which takes the hidden `--test-*` seams only with the feature.
name = "run"
path = "tests/run.rs"
required-features = ["test-seams"]

[lints]
workspace = true

[features]
# Builds the box with `gate-args`' hidden `--test-*` seams, read before the verb.
test-seams = ["gate-args/test-seams", "gate-wire/test-seams"]

[dependencies]
gate-args = { path = "../gate-args" }
gate-inputs = { path = "../gate-inputs" }
gate-watchdog = { path = "../gate-watchdog" }
gate-wire = { path = "../gate-wire" }
# A process line's own moments: its start and how long it ran, which `gate_wire::stamp` writes.
jiff = "0.2.37"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# The tests build request words as the PC's client does: base64 of the JSON payload.
base64 = "0.23.1"
