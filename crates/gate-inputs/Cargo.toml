[package]
name = "gate-inputs"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# Plans each `git check-attr` slice of the LFS listing for two short paths, so a suite case's few files span slices;
# forwarded by every crate whose own `test-seams` feature is the gate's.
test-seams = []

[dependencies]
gate-router = { path = "../gate-router" }
gate-wire = { path = "../gate-wire" }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
zstd = "0.14.2"
