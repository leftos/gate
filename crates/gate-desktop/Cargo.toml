[package]
name = "gate-desktop"
version.workspace = true
edition = "2024"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# The helper's five seams: `GATE_DESKTOP_TEST_LIMIT_MS`, which caps each of its waits; `GATE_DESKTOP_TEST_PIPE_OWNER=user`,
# which makes it take a control pipe its user owns in place of Administrators; `GATE_DESKTOP_TEST_FAULT`, which picks
# one step of its run to break; `GATE_DESKTOP_TEST_RECORD`, which names a file it adds each child's pid to; and
# `GATE_DESKTOP_TEST_INPUT_DESKTOP`, which names the input desktop in place of the one it reads. It also turns on
# gate-win32's own test seams. An installed helper is built without.
test-seams = ["gate-win32/test-seams", "gate-wire/test-seams"]

[dependencies]
base64 = "0.23.1"
gate-win32 = { path = "../gate-win32" }
gate-wire = { path = "../gate-wire" }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemServices"] }

[dev-dependencies]
# The unit tests make a pipe their own user owns (`PipeOwner::User`), which gate-win32 has only with its test seams.
gate-win32 = { path = "../gate-win32", features = ["test-seams"] }
# Reads the built helper's import and load config directories (`image`): parsing the load config by hand is
# error-prone, and the crate is test-only.
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "std"] }
proc-table = { path = "../proc-table" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "gate-desktop-helper"
path = "src/bin/gate-desktop-helper.rs"

# Without the `test-seams` feature (`--all-features` or `--features test-seams`) cargo skips this suite silently.
[[test]]
name = "helper"
path = "tests/helper.rs"
required-features = ["test-seams"]
